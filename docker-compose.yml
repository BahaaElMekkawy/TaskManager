# ==============================================================================
# TaskManager — full local stack
# ==============================================================================
#   cp .env.example .env
#   docker compose up --build
#
# Everything is provisioned automatically: Postgres boots, GoTrue creates the
# auth schema, then the one-shot `migrator` service applies our SQL migrations
# and seeds demo data. No manual database setup is required.
#
# The Supabase CLI (`supabase start`) is deliberately NOT used: it is its own
# orchestrator and cannot be driven from `docker compose up`. Instead the
# official self-hosted service images are composed directly here, which is what
# the CLI does under the hood anyway.
#
# Ports (all configurable in .env):
#   3000  web        the React application
#   8000  kong       Supabase API gateway (auth, rest, realtime, storage)
#   3001  studio     Supabase Studio
#   9000  inbucket   captured outbound email
#   5432  db         Postgres
# ==============================================================================

name: taskmanager

services:
  # ----------------------------------------------------------------------------
  # Postgres — the actual source of truth. RLS lives here, not in the client.
  # ----------------------------------------------------------------------------
  db:
    image: supabase/postgres:15.8.1.060
    container_name: taskmanager-db
    restart: unless-stopped
    ports:
      - '${POSTGRES_PORT_EXTERNAL}:${POSTGRES_PORT}'
    environment:
      POSTGRES_HOST: /var/run/postgresql
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PORT: ${POSTGRES_PORT}
      PGPORT: ${POSTGRES_PORT}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRY: ${JWT_EXPIRY}
    volumes:
      - db-data:/var/lib/postgresql/data
      # `init-scripts` run after the image's own role bootstrap; `migrations`
      # run after that. Ordering matters — roles.sql can only set passwords for
      # roles that already exist, and logs.sql needs the _supabase database.
      - ./docker/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
      - ./docker/db/auth-ownership.sql:/docker-entrypoint-initdb.d/init-scripts/99-zz-auth-ownership.sql:ro
      - ./docker/db/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:ro
      - ./docker/db/_supabase.sql:/docker-entrypoint-initdb.d/migrations/97-_supabase.sql:ro
      - ./docker/db/realtime.sql:/docker-entrypoint-initdb.d/migrations/98-realtime.sql:ro
      - ./docker/db/logs.sql:/docker-entrypoint-initdb.d/migrations/99-logs.sql:ro
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - log_min_messages=fatal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -h localhost -p ${POSTGRES_PORT}']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # ----------------------------------------------------------------------------
  # GoTrue — registration, login, JWT issuance. Owns the `auth` schema and runs
  # its own migrations on startup, which is why `migrator` waits for it.
  # ----------------------------------------------------------------------------
  auth:
    image: supabase/gotrue:v2.177.0
    container_name: taskmanager-auth
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL}

      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}

      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS}
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP}

      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}

      GOTRUE_EXTERNAL_EMAIL_ENABLED: ${ENABLE_EMAIL_SIGNUP}
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: ${ENABLE_ANONYMOUS_USERS}
      # Local development has no deliverable mailbox, so confirmation is skipped.
      GOTRUE_MAILER_AUTOCONFIRM: ${ENABLE_EMAIL_AUTOCONFIRM}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL}
      GOTRUE_SMTP_HOST: ${SMTP_HOST}
      GOTRUE_SMTP_PORT: ${SMTP_PORT}
      GOTRUE_SMTP_USER: ${SMTP_USER}
      GOTRUE_SMTP_PASS: ${SMTP_PASS}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME}
      GOTRUE_MAILER_URLPATHS_INVITE: ${MAILER_URLPATHS_INVITE}
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: ${MAILER_URLPATHS_CONFIRMATION}
      GOTRUE_MAILER_URLPATHS_RECOVERY: ${MAILER_URLPATHS_RECOVERY}
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: ${MAILER_URLPATHS_EMAIL_CHANGE}

      GOTRUE_EXTERNAL_PHONE_ENABLED: ${ENABLE_PHONE_SIGNUP}
      GOTRUE_SMS_AUTOCONFIRM: ${ENABLE_PHONE_AUTOCONFIRM}
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://localhost:9999/health',
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # ----------------------------------------------------------------------------
  # PostgREST — turns the `public` schema into the REST API the SPA consumes.
  # Connects as `authenticator`, a role with no privileges of its own; it
  # switches to `anon` or `authenticated` per request based on the JWT, which is
  # what makes RLS apply.
  # ----------------------------------------------------------------------------
  rest:
    image: postgrest/postgrest:v12.2.12
    container_name: taskmanager-rest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS}
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: 'false'
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY}
      # Hard ceiling on rows per request: a forgotten .range() cannot dump a table.
      PGRST_DB_MAX_ROWS: ${PGRST_DB_MAX_ROWS}
    command: ['postgrest']

  # ----------------------------------------------------------------------------
  # Realtime — not used by the application today, included as part of the
  # standard Supabase surface. See README "Future improvements" for the
  # live-updating task board it would enable.
  # ----------------------------------------------------------------------------
  realtime:
    image: supabase/realtime:v2.34.47
    container_name: taskmanager-realtime
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4000
      DB_HOST: ${POSTGRES_HOST}
      DB_PORT: ${POSTGRES_PORT}
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      DB_AFTER_CONNECT_QUERY: 'SET search_path TO _realtime'
      DB_ENC_KEY: ${REALTIME_DB_ENC_KEY}
      API_JWT_SECRET: ${JWT_SECRET}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      RLIMIT_NOFILE: '10000'
      APP_NAME: realtime
      SEED_SELF_HOST: 'true'
      RUN_JANITOR: 'true'

  # ----------------------------------------------------------------------------
  # Storage + imgproxy — not used by the application today (no file uploads in
  # the requirements), included for stack completeness.
  # ----------------------------------------------------------------------------
  storage:
    image: supabase/storage-api:v1.19.3
    container_name: taskmanager-storage
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      PGRST_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub
      GLOBAL_S3_BUCKET: stub
      ENABLE_IMAGE_TRANSFORMATION: 'true'
      IMGPROXY_URL: http://imgproxy:5001
    volumes:
      - storage-data:/var/lib/storage

  imgproxy:
    image: darthsim/imgproxy:v3.8.0
    container_name: taskmanager-imgproxy
    restart: unless-stopped
    environment:
      IMGPROXY_BIND: ':5001'
      IMGPROXY_LOCAL_FILESYSTEM_ROOT: /
      IMGPROXY_USE_ETAG: 'true'
      IMGPROXY_ENABLE_WEBP_DETECTION: ${IMGPROXY_ENABLE_WEBP_DETECTION}
    volumes:
      - storage-data:/var/lib/storage:ro

  # ----------------------------------------------------------------------------
  # postgres-meta — schema introspection API that powers Studio's table editor.
  # ----------------------------------------------------------------------------
  meta:
    image: supabase/postgres-meta:v0.89.3
    container_name: taskmanager-meta
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: ${POSTGRES_HOST}
      PG_META_DB_PORT: ${POSTGRES_PORT}
      PG_META_DB_NAME: ${POSTGRES_DB}
      PG_META_DB_USER: supabase_admin
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}

  # ----------------------------------------------------------------------------
  # Supabase Studio — lets a reviewer inspect the schema, confirm RLS is enabled
  # on every table, and browse seeded rows without installing anything.
  # ----------------------------------------------------------------------------
  studio:
    image: supabase/studio:2026.07.27-sha-cbb076d
    container_name: taskmanager-studio
    restart: unless-stopped
    depends_on:
      meta:
        condition: service_started
    ports:
      - '${STUDIO_PORT}:3000'
    environment:
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DEFAULT_ORGANIZATION_NAME: ${STUDIO_DEFAULT_ORGANIZATION}
      DEFAULT_PROJECT_NAME: ${STUDIO_DEFAULT_PROJECT}
      SUPABASE_URL: http://kong:8000
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      AUTH_JWT_SECRET: ${JWT_SECRET}
      NEXT_PUBLIC_ENABLE_LOGS: 'false'
    # The image's baked-in healthcheck calls /api/platform/profile, a
    # Supabase Cloud endpoint that doesn't exist in self-hosted mode — it
    # would always report unhealthy despite Studio serving the UI correctly.
    # Nothing else depends on this service's health, so disabling it only
    # affects `docker compose ps` cosmetics.
    healthcheck:
      disable: true

  # ----------------------------------------------------------------------------
  # Kong — single public entrypoint. The SPA only knows about this URL.
  # The entrypoint expands $VARIABLES inside kong.yml before Kong reads it.
  # ----------------------------------------------------------------------------
  kong:
    image: kong:2.8.1
    container_name: taskmanager-kong
    restart: unless-stopped
    depends_on:
      auth:
        condition: service_started
      rest:
        condition: service_started
    ports:
      - '${KONG_HTTP_PORT}:8000/tcp'
      - '${KONG_HTTPS_PORT}:8443/tcp'
    environment:
      KONG_DATABASE: 'off'
      KONG_DECLARATIVE_CONFIG: /home/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD}
    volumes:
      - ./docker/kong/kong.yml:/home/kong/temp.yml:ro
    entrypoint: >
      bash -c 'eval "echo \"$$(cat ~/temp.yml)\"" > ~/kong.yml
      && /docker-entrypoint.sh kong docker-start'

  # ----------------------------------------------------------------------------
  # Inbucket — captures any outbound email locally (password resets, invites),
  # so no mail ever leaves the machine and flows stay inspectable.
  # ----------------------------------------------------------------------------
  inbucket:
    image: inbucket/inbucket:3.0.3
    container_name: taskmanager-inbucket
    restart: unless-stopped
    ports:
      - '${INBUCKET_PORT}:9000'

  # ----------------------------------------------------------------------------
  # Migrator — one-shot. Applies SQL migrations, then seeds demo data, then
  # exits 0. This is what removes any manual database setup step.
  #
  # Migrations and seeds are bind-mounted rather than baked into the image so
  # that editing SQL only needs `docker compose up migrator`, not a rebuild.
  # ----------------------------------------------------------------------------
  migrator:
    build:
      context: ./docker/migrator
    image: taskmanager-migrator:local
    container_name: taskmanager-migrator
    restart: 'no'
    depends_on:
      db:
        condition: service_healthy
      auth:
        # GoTrue must have created auth.users before our foreign keys reference it.
        condition: service_healthy
    environment:
      PGHOST: ${POSTGRES_HOST}
      PGPORT: ${POSTGRES_PORT}
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: supabase_admin
      PGPASSWORD: ${POSTGRES_PASSWORD}
      AUTH_URL: http://auth:9999
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      SEED_DATABASE: ${SEED_DATABASE}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD}
    volumes:
      - ./supabase/migrations:/supabase/migrations:ro
      - ./supabase/seed:/supabase/seed:ro
      - ./supabase/scripts:/supabase/scripts:ro

  # ----------------------------------------------------------------------------
  # Web — React SPA built with Vite, served as static files by nginx.
  #
  # VITE_* values are inlined at BUILD time, so they are build args rather than
  # runtime environment. Changing them requires `docker compose up --build`.
  # ----------------------------------------------------------------------------
  web:
    build:
      context: ./web
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    image: taskmanager-web:local
    container_name: taskmanager-web
    restart: unless-stopped
    depends_on:
      kong:
        condition: service_started
      migrator:
        condition: service_completed_successfully
    ports:
      - '${WEB_PORT}:8080'

volumes:
  db-data:
  storage-data:
