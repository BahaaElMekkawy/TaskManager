# Serves the built SPA.
#
# The Supabase API is reached directly at http://localhost:8000 (Kong) rather
# than proxied through this server — supabase-js already targets that URL via
# VITE_SUPABASE_URL, and Kong itself applies CORS, so there is nothing this
# proxy would need to add. Keeping it out of the request path removes one hop
# and one more place a misconfiguration could break API calls.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compress text-based assets; JS/CSS/HTML are what this app ships.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml font/woff2;

    # Vite fingerprints filenames in /assets (e.g. index-4f9a2c1e.js), so those
    # files are immutable — a new deploy ships a new filename, never mutates an
    # old one. Caching them for a year is safe and removes a round trip on
    # every repeat visit.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html is NOT fingerprinted and must always be revalidated, or a
    # deploy would leave returning visitors on a stale shell that references
    # assets which no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # SPA fallback: any path that isn't a real file resolves to index.html so
    # client-side routes like /projects/:id survive a hard refresh instead of
    # hitting nginx's own 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
