<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Plan projects, track tasks and collaborate with your team." />
    <title>TaskManager</title>
    <script>
      // Applied before first paint so a dark-mode user never sees a white flash.
      // Kept inline and dependency-free for that reason.
      (function () {
        try {
          const stored = localStorage.getItem('taskmanager-theme');
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (stored !== 'light' && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch {
          /* localStorage can throw in private browsing; the default theme is fine. */
        }
      })();
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
